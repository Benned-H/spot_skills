# Define an environment for developing the OpenDrawer skill
robot_base_poses:
  spot: [0, 0, 0.56, 0, 0, 0] # x, y, z, roll, pitch, yaw

object_poses:
  eraser1:
    xyz_rpy: [0.22, 0, 0.46, 0, 0, 0] # Up and a bit forwards from the filing cabinet frame
    frame: drawer1

  filing_cabinet1: [1, 0, 0, 0, 0, 3.1416]

collision_models:
  eraser1:
    primitives: [{ type: box, x: 0.05, y: 0.125, z: 0.03 }]

  filing_cabinet_closed:
    meshes:
      - filepath: ../object_models/obj_meshes/office_drawer_closed/office_drawer_closed.obj
        transforms:
          - center_bounds
          - bottom_at_zero_z

  filing_cabinet_open:
    meshes:
      - filepath: ../object_models/obj_meshes/office_drawer_open_mid/office_drawer_open_mid.obj
        transforms:
          - center_bounds
          - bottom_at_zero_z

containers:
  filing_cabinet1:
    closed_model: filing_cabinet_closed
    open_model: filing_cabinet_open
    contains: [eraser1]
    state: closed

# Define the environment for the SciLi experiment

robots:
  spot:
    base_pose: [0, 0, 0.56, 0, 0, 0] # x, y, z, roll, pitch, yaw

objects:
  eraser1: # Sitting in front of Spot
    pose:
      [
        1.9138828449945797,
        -0.25429498008196083,
        -0.47072647736991735,
        0.5333194436744071,
        0.03221088069142202,
        1.936849568077164,
      ]
    collision_model: # y-axis runs lengthwise; z-axis is "up"
      primitives: [{ type: box, x: 0.05, y: 0.125, z: 0.03 }]

  black_dresser:
    pose:
      xyz_rpy:
        [
          3.235647227337902,
          -4.044709016739534,
          -0.7119915557996201,
          -0.00803438094125164,
          -0.0028178345151123403,
          3.0657805752158924,
        ]
      frame: map
    container:
      status: closed
      open_model:
        meshes: # TODO:Need updated scan
          - filepath: /docker/spot_skills/src/spot_skills/domains/object_models/obj_meshes/black_dresser_open_cropped/textured_output.obj
            transforms:
              - { rotate: [1.5708, 0, 0] }
              - center_bounds
              - bottom_at_zero_z
              - { translate: [0.09, -0.12, 0] } # Shift the mesh so that it's centered on the frame
      closed_model:
        primitives: [{ type: box, x: 0.496, y: 0.754, z: 0.694 }]
      contains: [] # List of objects contained by the container

waypoints:
  open_drawer:
    x_y_yaw: [1.22, 0, 3.14159]
    frame: black_dresser

  dock: [1.7978, -0.3383, 3.14159]
  open_door: [5.44, -6.4, 1.5708]

default_frame: map

# Define the environment for the SciLi experiment

robots:
  spot:
    base_pose: [0, 0, 0.56, 0, 0, 0] # x, y, z, roll, pitch, yaw

objects:
  eraser1: # Begins inside the dresser, so that's where its pose is specified
    pose: [0.797, -0.741, 0.220, 0.030, 0.037, 1.160]
    collision_model: # y-axis runs lengthwise; z-axis is "up"
      primitives: [{ type: box, x: 0.05, y: 0.125, z: 0.03 }]

  black_dresser:
    pose: [3.6, -3.8, -0.48, 0, 0, 3.14159] # TODO: Does this align with the occupancy grid?
    container:
      status: open # TODO: Should begin closed in full experiment

      open_model:
        meshes:
          - filepath: /docker/spot_skills/src/spot_skills/domains/object_models/obj_meshes/black_dresser_open/black_dresser_open.obj
            transforms:
              - { rotate: [1.5708, 0, -1.5708] }
              - center_bounds
              - bottom_at_zero_z
              - { translate: [0.12, 0, 0] }

      closed_model:
        meshes:
          - filepath: /docker/spot_skills/src/spot_skills/domains/object_models/obj_meshes/black_dresser_closed/black_dresser_closed.obj
            transforms:
              - { rotate: [1.5708, 0, 1.5708] }
              - center_bounds
              - bottom_at_zero_z

      # contains: # Eraser begins inside the closed dresser
      #   eraser1:
      #     pose_when_open: [0.33, 0, 0.56, 0, 0, 1.5708] # Based on rough real-world measurements
      #     pose_when_closed: [0.108, 0, 0.56, 0, 0, 1.5708]

  filing_cabinet:
    pose: [0.704, -0.785, -0.466, 0.016, -0.003, -0.052]
    collision_model:
      primitives: [
          { type: box, x: 0.454, y: 0.38, z: 0.6 }, # HACK: Shortened by 9.4 cm
          {
            type: box,
            x: 0.454,
            y: 0.19,
            z: 1.2,
            pose: [0, -0.095, 0, 0, 0, 0],
          },
        ]

  obstruction_near_cabinet:
    pose:
      xyz_rpy: [0, -0.095, 10, 0, 0, 0]
      frame: filing_cabinet
    collision_model:
      primitives: [{ type: box, x: 0.454, y: 0.19, z: 1.2 }]

  # The door is modeled as a container with a different collision model when open or closed
  # When open, the door has no collision model (it swings out of the way of navigation)
  door1:
    pose: [4.85, -5.2, 0, 0, 0, 0]
    container:
      status: closed

      open_model: null # Explicitly no collision model; open door swings out of navigation space

      closed_model: # Dimensions of the actual door in SciLi (made thicker from 5 cm to 15 cm)
        primitives: [{ type: box, x: 0.91, y: 0.15, z: 2.27 }]

      contains: {}

  board1:
    pose: [6.6, -3.35, 0.4, 0, 0, -1.5708] # TODO: Fake pose numbers
    collision_model:
      primitives: [{ type: box, x: 0.03, y: 1.3, z: 0.9 }] # TODO: Dummy values

waypoints:
  open_drawer:
    x_y_yaw: [1.32, 0, 3.14159] # TODO: Ensure this works in the new map!
    frame: black_dresser

  pick_from_drawer:
    x_y_yaw: [1.32, 0, 3.14159]
    frame: black_dresser

  dock: [1.7978, -0.3383, 3.14159]
  open_door: [5.1, -6.5, 1.5708] # Distancing from door to avoid padding: -6.4 became -6.5
  close_door: [5.143, -3.991, -3.121]

  view_door_handle: [4.445, -6.254, 1.5708]

  # erase: [6.5, -4.2, 1.5708]
  erase: [5.1, -4.4, 3.14]

  pick_from_filing_cabinet:
    x_y_yaw: [6.494, -4.530, 0]
    frame: map
    # x_y_yaw: [0.185, 0.802, -1.611]
    # frame: filing_cabinet

  facing_filing_cabinet:
    x_y_yaw: [6.494, -4.530, 0]
    frame: map
    # x_y_yaw: [0.185, 0.802, -1.611]
    # frame: filing_cabinet

default_frame: map

# Note: map_to_seed correction is in config/map_to_seed.yaml


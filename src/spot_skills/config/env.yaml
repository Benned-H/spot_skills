# Define the environment for the ICRA 2026 video Spot experiment
robot_base_poses:
  spot: [0, 0, 0.56, 0, 0, 0] # x, y, z, roll, pitch, yaw

# Specify any known object poses in the environment
object_poses:
  eraser1:
    xyz_rpy: [0.34, 0, 0.6, 0, 0, -1.5708] # Up and a bit forwards
    frame: black_dresser

  black_dresser:
    # xyz_rpy: [0, 0, 0, 0, 0, 0]
    xyz_rpy:
      [
        -0.5762298745028124,
        3.386931360346417,
        -0.36912713402932673,
        -0.007921139557283206,
        -0.04207135184573009,
        0.0006282979713951455,
      ]

    frame: map

collision_models:
  eraser1:
    primitives: [{ type: box, x: 0.125, y: 0.05, z: 0.03 }]

  black_dresser_closed:
    primitives:
      - { type: box, x: 0.496, y: 0.754, z: 0.694 }

  black_dresser_open:
    meshes: # TODO: Update from Alper's scan
      - filepath: /docker/spot_skills/src/spot_skills/domains/object_models/obj_meshes/black_dresser_open_cropped/textured_output.obj
        transforms:
          - { rotate: [1.5708, 0, 0] }
          - center_bounds
          - bottom_at_zero_z
          - { translate: [0.09, -0.12, 0] } # Shift the mesh so that it's centered on the frame

containers:
  black_dresser:
    status: closed
    open_model: black_dresser_open
    closed_model: black_dresser_closed
    contains: [] #[eraser1]

object_types:
  # eraser1: [eraser, pickable]
  black_dresser: [dresser, drawer]

waypoints:
  open_drawer:
    x_y_yaw: [1.22, 0, 3.14159]
    frame: black_dresser
  open_door:
    x_y_yaw: [-2.0918805239864375, -6.810093386465102, 1.6882104116596146] # TODO: Find base pose!
    frame: map
  close_door:
    x_y_yaw: [-2.122, -4.669, 0] # TODO: Find base pose!
    frame: map
  erase:
    x_y_yaw: [0, 0, 0] # TODO: Find base pose!
    frame: map
  pick_from_drawer:
    x_y_yaw: [1.1, 0, 3.14159]
    frame: black_dresser

  a:
    x_y_yaw: [0.713996891, -1.31167166, 2.671049]
    frame: map
  b:
    x_y_yaw: [0.37204507, 2.7243384, -2.96320]
    frame: map
  c:
    x_y_yaw: [1.4192032317, 1.474546, 1.632884649]
    frame: map
  d:
    x_y_yaw: [1.814814, -1.28268238, 2.823126887]
    frame: map

default_frame: map

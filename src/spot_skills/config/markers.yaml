# Fiducial marker configuration for the SciLi demos

markers:
  marker_0:
    size_cm: 4.5
    relative_frames:
      eraser1: [0, 0, -0.032, 0, 0, 0] # Eraser's frame is directly "below" the marker's
  marker_3: # Attached to the top-right of the filing cabinet
    size_cm: 4.5 # Size (cm) along one side of the marker's black square
    relative_frames: # Relative transforms (expressed w.r.t. marker frame)
      filing_cabinet1: [-0.149, -0.560, -0.228, 0, -1.5708, -1.5708]

cameras:
  frontleft:
    recognized_sizes_cm: [4.5] # Sizes (cm) of tags that each camera is configured to recognize
  frontright:
    recognized_sizes_cm: [4.5]
  hand:
    recognized_sizes_cm: [4.5]

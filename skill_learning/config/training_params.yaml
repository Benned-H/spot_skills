# Training hyperparameters for BC-RNN

# Data
data: "bags/"              # Path to .bag/.npy file(s) or directory
joint_name: "hand"         # TF child frame name
seq_len: 3            # Sliding window length
val_ratio: 0.1             # Fraction of data for validation
delta_actions: true        # true: action = pose[t+1] - pose[t], false: action = pose[t+1]
subsample: 4              # Keep every Nth frame (1 = all, 2 = skip every other, etc.)

# Rosbag settings (used when data contains .bag files)
rosbag:
  image_topic: "/spot/camera/left/image"
  tf_topic: "/tf"
  parent_frame: "body"
  sync_threshold: 0.05     # Max time gap (seconds) for image-TF pairing

# Trim static frames at start/end of each trajectory
trim_static:
  window: 5                # Sliding window size for variance calculation
  threshold: 5.0e-5          # Max variance below which frames are considered static

# Debug (--debug flag saves extracted rosbag data as .npy)
debug_dir: "debug/"

# Model architecture
model:
  state_dim: 6
  action_dim: 6
  hidden_dim: 256
  in_channels: 1            # 1=grayscale, 3=RGB
  image_size: 224
  freeze_backbone: true

# Training
epochs: 200
batch_size: 16
lr: 1.0e-4
weight_decay: 1.0e-5
grad_clip: 1.0              # Gradient clipping norm (0 to disable)
num_workers: 0              # Set > 0 requires sufficient /dev/shm (see docker --shm-size)

# Saving
save_dir: "checkpoints"
save_every: 50               # Save checkpoint every N epochs

# Weights & Biases
wandb:
  enabled: true
  project: "bc-rnn-spot"
  run_name: null              # Auto-generated if null

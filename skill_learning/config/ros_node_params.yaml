# Parameters for deploy_ros_node.py

# Model checkpoint
checkpoint: "checkpoints/best.pt"

# Model architecture (must match training)
model:
  state_dim: 6
  action_dim: 6
  hidden_dim: 256
  in_channels: 1
  image_size: 224

# Action mode (must match training)
delta_actions: true        # true: model predicts delta, false: model predicts absolute pose

# TF frame to track
joint_name: "hand"
parent_frame: "body"

# ROS topics
topics:
  image_sub: "/camera/image_raw"
  tf_sub: "/tf"
  action_pub: "/bc_rnn/action"        # geometry_msgs/PoseStamped

# Inference rate (Hz)
rate: 10
